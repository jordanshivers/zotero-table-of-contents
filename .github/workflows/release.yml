name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check that the tag matches the manifest version
        run: |
          version=$(python3 -c "import json; print(json.load(open('src/manifest.json'))['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Build
        run: python3 build.py
      - name: Check that updates.json was committed for this version
        run: git diff --exit-code -- updates.json
      - name: Test
        run: node --test tests/*.test.cjs
      - name: Attach the package to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          file="dist/zotero-table-of-contents-$VERSION.xpi"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$file" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$file" --title "$GITHUB_REF_NAME" --generate-notes
          fi
